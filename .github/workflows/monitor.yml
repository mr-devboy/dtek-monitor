name: Run power outages monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [check-dtek]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - name: Checkout artifacts
        run: |
          REMOTE_BRANCH=$(git ls-remote --heads origin artifacts)

          if [ -n "$REMOTE_BRANCH" ]; then
            git fetch --depth 1 origin artifacts
            git worktree add --detach artifacts FETCH_HEAD
          else
            git worktree add --orphan -b artifacts artifacts
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run monitoring script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REGION: ${{ secrets.REGION }}
          CITY: ${{ secrets.CITY }}
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
        run: node ./src/monitor.js

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git -C artifacts add --all

          if git -C artifacts diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          if git -C artifacts rev-parse --verify --quiet HEAD; then
            git -C artifacts commit --amend --no-edit
          else
            git -C artifacts commit -m "chore: update artifacts"
          fi

          git push --force origin "$(git -C artifacts rev-parse HEAD):refs/heads/artifacts"
